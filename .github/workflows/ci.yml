name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race ./...
  kind:
    # End to end: a real pod on a real (kind) cluster.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: helm/kind-action@v1
      - run: go build -o coldstart .
      - run: |
          ./coldstart run -f examples/llama-cpp-pod.yaml --probe-port 8080 \
            --probe-path /v1/completions --probe-body examples/one-token.json \
            --gpus 1 --gpu-hour 2.49 --json result.json --delete
      - uses: actions/upload-artifact@v4
        with: { name: coldstart-result, path: result.json }
