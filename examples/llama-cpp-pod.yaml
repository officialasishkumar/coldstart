# A small LLM server whose weights are downloaded at startup, the way many
# inference pods work. Swap the image and model for vLLM on a GPU node.
apiVersion: v1
kind: Pod
metadata:
  generateName: llm-coldstart-
  labels:
    app: llm-coldstart
spec:
  restartPolicy: Never
  volumes:
    - name: models
      emptyDir: {}
  initContainers:
    - name: fetch-weights
      image: curlimages/curl:8.11.1
      command: ["curl", "-fsSL", "-o", "/models/model.gguf",
                "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"]
      volumeMounts:
        - { name: models, mountPath: /models }
  containers:
    - name: server
      image: ghcr.io/ggml-org/llama.cpp:server
      args: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "2048"]
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet: { path: /health, port: 8080 }
        periodSeconds: 2
      volumeMounts:
        - { name: models, mountPath: /models }
